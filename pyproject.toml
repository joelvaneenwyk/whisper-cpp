[project]
name = "whisper-cpp"
version = "1.6.2"
description = "Add your description here"
authors = [{ name = "Joel Van Eenwyk", email = "joel.vaneenwyk@gmail.com" }]
dependencies = [
    "torch",
    "coremltools",
    "openai-whisper",
    "ane-transformers",
    "elevenlabs>=1.3.1",
]
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/models/convert-h5-to-coreml.py",
    "src/models/convert-h5-to-ggml.py",
    "src/models/convert-pt-to-ggml.py",
    "src/models/convert-whisper-to-coreml.py",
    "src/models/convert-whisper-to-openvino.py",
    "src/models/ggml_to_pt.py",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".build/",
    ".git/",
    ".mypy_cache/",
    ".task/",
    ".venv/",
    "build/",
    "dist/",
    "external/vcpkg/",
    "vcpkg_installed/",
]
ignore-vcs = true

[tool.uv]
managed = true
package = true
prerelease = "allow"
index-strategy = "unsafe-best-match"
link-mode = "copy"

[tool.uv.pip]
universal = true

[tool.uv.sources]
openai-whisper = { git = "https://github.com/joelvaneenwyk/whisper.git" }
pyyaml = { git = "https://github.com/yaml/pyyaml.git" }
tqdm = { git = "https://github.com/tqdm/tqdm.git" }
torch = [
    { index = "pytorch-gpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    { index = "pytorch-gpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-gpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
triton = [
    { index = "pytorch-gpu", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
prerelease = "allow"

[tool.ruff]
line-length = 120
exclude = [
    ".build/",
    ".git/",
    ".mypy_cache/",
    ".task/",
    ".venv/",
    "build/",
    "dist/",
    "external/vcpkg/",
    "vcpkg_installed/",
]
